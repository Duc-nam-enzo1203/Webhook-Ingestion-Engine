global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'webhook-gateway'
    static_configs:
      - targets: ['gateway:3000']
        labels:
          service: 'ingestion-gateway'

  - job_name: 'webhook-worker'
    static_configs:
      - targets: ['worker:3002']
        labels:
          service: 'webhook-worker'

